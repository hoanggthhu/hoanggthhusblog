<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liên lạc - Hoàngg Thhư's Blog</title>
  <meta name="description" content="Liên hệ với Hoàngg Thhư's Blog">
  
  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    body { 
      background: linear-gradient(135deg, #fdfcfb, #f3f0ec); 
      font-family: 'Inter', sans-serif;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .gradient-title {
      background: linear-gradient(90deg, #6a4caf, #ff8a65);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .contact-section {
      max-width: 650px;
      margin: 48px auto;
      padding: 28px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 0.7s ease-out forwards;
    }
    @keyframes slideUp {
      to { transform: translateY(0); opacity: 1; }
    }
    .contact-section h2 {
      text-align: center;
      margin-bottom: 8px;
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
    }
    .contact-section p.lead {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 14px; }
    label { 
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #222;
    }
    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #fcfcfc;
      font-size: 0.98rem;
      outline: none;
      transition: all 0.25s ease;
    }
    input:focus, textarea:focus {
      border-color: #c084fc;
      box-shadow: 0 0 6px rgba(192,132,252,0.4);
      background: #fff;
    }
    ::placeholder {
      opacity: 0.7;
      transition: opacity 0.25s ease;
    }
    input:focus::placeholder, textarea:focus::placeholder {
      opacity: 0.3;
    }
    textarea { min-height: 120px; resize: vertical; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-align: center;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--accent1, #f59e0b), var(--accent2, #ef4444));
      transition: all 0.3s ease;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.95; }

    /* Success pulse */
    .btn.success {
      background: #22c55e !important;
      animation: pulse 0.8s ease-in-out 2;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Error shake */
    .btn.error {
      background: #ef4444 !important;
      animation: shake 0.4s;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .form-message {
      margin-top: 12px;
      font-weight: 600;
      text-align: center;
    }
    .success-text { color: #16a34a; }
    .error-text { color: #dc2626; }
    
    @media (max-width:640px) {
      .contact-section { margin: 20px; padding: 18px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <h1 class="gradient-title">Hoàngg Thhư's Blog</h1>
        <p class="tag"> Mình học cách yêu thương</p>
        <p class="tag"> và trưởng thành với một trái tim nguyên vẹn</p>
      </a>
      <button id="nav-toggle" aria-label="Toggle menu">☰</button>
      <nav id="main-nav" class="main-nav">
        <ul>
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="mo-nang.html">Mơ Nắng</a></li>
          <li><a href="o-trong-vuon.html">Ở Trong Vườn</a></li>
          <li><a href="binh-yen.html">Góc bình yên</a></li>
          <li><a href="blogs.html">Blogs</a></li>
          <li><a href="ve-toi.html">Về mình</a></li>
          <li><a href="contact.html" class="active">Liên lạc</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="contact-section">
      <h2 class="gradient-title">📬 Liên hệ với mình</h2>
      <p class="lead">Nếu bạn muốn nhắn gửi điều gì, điền vào form dưới đây nhé 💌</p>
      <form id="contact-form" action="https://formspree.io/f/xnnzybdk" method="POST">
        <div class="form-group">
          <label for="name">Họ và tên</label>
          <input id="name" name="name" type="text" placeholder="Nhập tên của bạn" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Nhập email của bạn" required>
        </div>
        <div class="form-group">
          <label for="message">Nội dung tin nhắn</label>
          <textarea id="message" name="message" placeholder="Viết điều bạn muốn chia sẻ..." required></textarea>
        </div>
        <button type="submit" class="btn">📩 Gửi tin nhắn</button>
        <div id="form-message" class="form-message"></div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Hoàngg Thhư's Blog</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", function(){
      const navToggle = document.getElementById("nav-toggle");
      const mainNav = document.getElementById("main-nav");
      const form = document.getElementById("contact-form");
      const formMessage = document.getElementById("form-message");
      const submitBtn = form.querySelector(".btn");

      if (navToggle && mainNav) {
        navToggle.addEventListener("click", () => mainNav.classList.toggle("active"));
        mainNav.querySelectorAll("a").forEach(link => {
          link.addEventListener("click", () => mainNav.classList.remove("active"));
        });
      }

      document.getElementById("year").textContent = new Date().getFullYear();

      if (form) {
        form.addEventListener("submit", function(e){
          e.preventDefault();
          formMessage.textContent = "Đang gửi...";
          formMessage.className = "form-message";
          submitBtn.disabled = true;

          fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          }).then(response => {
            if (response.ok) {
              formMessage.textContent = "✨ Tin nhắn đã được gửi thành công!";
              formMessage.classList.add("success-text");
              submitBtn.classList.add("success");
              submitBtn.textContent = "✅ Đã gửi";
              form.reset();
            } else {
              throw new Error("Gửi thất bại, vui lòng thử lại.");
            }
          }).catch(error => {
            formMessage.textContent = "❌ " + error.message;
            formMessage.classList.add("error-text");
            submitBtn.classList.add("error");
            submitBtn.textContent = "❌ Lỗi";
          }).finally(() => {
            setTimeout(() => {
              submitBtn.disabled = false;
              submitBtn.classList.remove("success", "error");
              submitBtn.textContent = "📩 Gửi tin nhắn";
            }, 2000);
          });
        });
      }
    });
  </script>
</body>
</html>
